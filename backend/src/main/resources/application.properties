# =============================================================================
#  Sarkari Bharti backend configuration
# =============================================================================
#  Every secret below is read from an environment variable with NO fallback.
#  If one is missing the application refuses to start, which is deliberate --
#  a missing secret should be a loud failure, never a silent weak default.
#
#  For local development, copy .env.example and export the values, or pass them
#  as JVM args:  mvn spring-boot:run -Dspring-boot.run.arguments=--DB_PASSWORD=...
# =============================================================================

# --- Server ---
# PORT first, because Render, Railway, Fly and Heroku all inject PORT and expect
# the process to bind it. Reading only SERVER_PORT meant the container started,
# listened on 8080, failed the platform's health check and was killed -- with
# nothing in the log to say why. SERVER_PORT still works for a local override.
server.port=${PORT:${SERVER_PORT:8080}}

# Return 404 instead of a stack trace for unmapped paths, and never include
# the exception message or stack trace in an HTTP response body.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Needed so rate limiting and the view-counter dedup see the real client IP
# rather than the load balancer's, once deployed behind a proxy.
server.forward-headers-strategy=framework

# --- Response compression ---
# Off by default in Tomcat, and worth turning on here because the responses are
# unusually compressible: a 20-row listing repeats the same twenty field names
# twenty times, so gzip removes roughly four-fifths of it. On the connection a
# typical visitor is using, bytes on the wire cost more than the CPU to squeeze
# them.
#
# The mime list is spelled out rather than left to the default. The default
# already covers JSON today; writing it down means a future Spring upgrade
# cannot quietly change that without this file disagreeing out loud.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
# Under a kilobyte the gzip framing and the round of CPU are not repaid, and a
# compressed short response can come out larger than the original.
server.compression.min-response-size=1024

# --- Tomcat threads ---
# The default ceiling is 200. Nothing good happens at 200 here: every one of
# them would be queued behind a connection pool of ten, so the 190 that cannot
# get a connection wait out connection-timeout and fail, having first cost a
# megabyte of stack each on a container with 512MB. Capped near what the pool
# can actually feed, excess load waits in the accept queue instead -- slower to
# answer, but it answers.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:5}

# --- Database connection ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sarkari_portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Modest pool: this app is read-heavy and sits behind a CDN cache.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# The rest of the pool settings exist because the database is a managed Postgres
# reached through a connection pooler, and a pooler drops connections that have
# been sitting idle -- without telling the client. Left at the defaults, Hikari
# hands out a socket the pooler closed twenty minutes ago and the first visitor
# after a quiet spell gets an error for a query that was never actually run.
#
# minimum-idle keeps a couple of connections warm, so the first request after
# quiet does not also pay TCP + TLS + Postgres authentication before any work
# starts. Two rather than zero, and two rather than ten: enough to absorb the
# first arrival, few enough to leave headroom in a shared connection budget.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# Retire connections at ten minutes, comfortably inside the pooler's own idle
# cutoff, so this side closes them deliberately instead of discovering later
# that the other side already did.
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:600000}
# Trim above minimum-idle after five minutes of not being needed. Must stay
# below max-lifetime or Hikari ignores it.
spring.datasource.hikari.idle-timeout=300000
# Ping the idle ones every two minutes. This is what turns "the pooler hung up
# and nobody noticed" into a connection quietly replaced between requests.
spring.datasource.hikari.keepalive-time=120000

# --- JPA / Hibernate ---
# "validate" means Hibernate checks the schema matches the entities and then
# leaves it alone. Flyway owns the schema (see db/migration). Never set this
# back to "update" in a deployed environment: it lets Hibernate silently
# alter live tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25

# --- Flyway (schema migrations) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate + baseline-version=1 is what lets this be switched on
# against the database the old ddl-auto=update setting already built:
#   - empty database  -> not baselined, every migration runs from V1
#   - existing tables -> baselined at 1, so V1 is marked done and V2+ run
# V1 is written with IF NOT EXISTS throughout, so it is harmless either way.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Admin login ---
# ADMIN_PASSWORD_HASH is a BCrypt hash, not a password. Generate one with:
#   mvn -q exec:java -Dexec.mainClass=com.sarkariportal.backend.tool.HashPassword -Dexec.args="yourpassword"
# or any BCrypt tool. The plaintext must never appear in this file.
admin.username=${ADMIN_USERNAME:admin}
admin.password-hash=${ADMIN_PASSWORD_HASH}

# --- JWT ---
# Generate with: openssl rand -base64 48
# Must be at least 32 characters. The application validates this at startup and
# refuses to boot on a short or known-placeholder value.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# The issuer is checked on every request (JwtUtil calls requireIssuer), so
# changing this value invalidates every token already issued. That is a one-time
# forced re-login for the admin after the rename deploy, not a bug.
jwt.issuer=sarkari-bharti

# --- CORS ---
# Comma-separated list of exact origins allowed to call this API. Must include
# the real frontend domain in production; localhost alone will block the
# deployed site. Wildcards, missing schemes and trailing slashes are all
# rejected at startup rather than failing later as a confusing browser error.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Rate limiting (requests per window, per client IP) ---
ratelimit.login.max-attempts=${RATELIMIT_LOGIN_MAX:5}
ratelimit.login.window-seconds=${RATELIMIT_LOGIN_WINDOW:900}
ratelimit.subscribe.max-attempts=${RATELIMIT_SUBSCRIBE_MAX:3}
ratelimit.subscribe.window-seconds=${RATELIMIT_SUBSCRIBE_WINDOW:3600}
# How long the same IP is ignored when re-viewing the same job.
viewcount.dedup-seconds=${VIEWCOUNT_DEDUP_SECONDS:21600}

# --- Site identity (used in outgoing email) ---
site.name=${SITE_NAME:Sarkari Bharti}
# Where the links in an alert point. Left blank it falls back to the first
# entry in cors.allowed-origins, which is already the frontend origin and is
# already required to be correct, so most deployments need not set this.
site.public-url=${SITE_PUBLIC_URL:}

# --- Email alerts (SMTP) ---
# OFF by default. With mail.enabled=false the MailService bean is not created
# at all, the site runs exactly as before, and /api/subscribers/broadcast
# answers with a clear "not set up yet" instead of failing at send time.
#
# To turn it on with Brevo's free tier (300 emails/day):
#   MAIL_ENABLED=true
#   MAIL_HOST=smtp-relay.brevo.com
#   MAIL_PORT=587
#   MAIL_USERNAME=<the login shown on Brevo's SMTP & API page>
#   MAIL_PASSWORD=<the SMTP key generated there -- NOT your account password>
#   MAIL_FROM_ADDRESS=<an address you verified as a sender in Brevo>
# See SETUP-EMAIL.md in the project root for the click-by-click version.
mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# STARTTLS on port 587. Required by Brevo, Gmail and every other provider worth
# using; without it the password crosses the network in the clear.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Without these two, a provider that stops responding mid-handshake hangs the
# sending thread forever and the broadcast never finishes or reports.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

mail.from-address=${MAIL_FROM_ADDRESS:}
mail.from-name=${MAIL_FROM_NAME:Sarkari Bharti}
mail.reply-to=${MAIL_REPLY_TO:}
# Guard against an absurd send, not a tuning knob. Raise it if the list grows.
mail.max-recipients=${MAIL_MAX_RECIPIENTS:2000}
# Pause between messages. Providers throttle bursts, and a rejected burst looks
# to the admin like the whole send failed.
mail.send-delay-ms=${MAIL_SEND_DELAY_MS:200}

# --- Logging ---
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
# Never log SQL parameters; they can contain subscriber email addresses.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
