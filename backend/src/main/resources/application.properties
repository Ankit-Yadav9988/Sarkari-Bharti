# =============================================================================
#  RojgarHub backend configuration
# =============================================================================
#  Every secret below is read from an environment variable with NO fallback.
#  If one is missing the application refuses to start, which is deliberate --
#  a missing secret should be a loud failure, never a silent weak default.
#
#  For local development, copy .env.example and export the values, or pass them
#  as JVM args:  mvn spring-boot:run -Dspring-boot.run.arguments=--DB_PASSWORD=...
# =============================================================================

# --- Server ---
# PORT first, because Render, Railway, Fly and Heroku all inject PORT and expect
# the process to bind it. Reading only SERVER_PORT meant the container started,
# listened on 8080, failed the platform's health check and was killed -- with
# nothing in the log to say why. SERVER_PORT still works for a local override.
server.port=${PORT:${SERVER_PORT:8080}}

# Return 404 instead of a stack trace for unmapped paths, and never include
# the exception message or stack trace in an HTTP response body.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Needed so rate limiting and the view-counter dedup see the real client IP
# rather than the load balancer's, once deployed behind a proxy.
server.forward-headers-strategy=framework

# --- Database connection ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sarkari_portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Modest pool: this app is read-heavy and sits behind a CDN cache.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# --- JPA / Hibernate ---
# "validate" means Hibernate checks the schema matches the entities and then
# leaves it alone. Flyway owns the schema (see db/migration). Never set this
# back to "update" in a deployed environment: it lets Hibernate silently
# alter live tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25

# --- Flyway (schema migrations) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate + baseline-version=1 is what lets this be switched on
# against the database the old ddl-auto=update setting already built:
#   - empty database  -> not baselined, every migration runs from V1
#   - existing tables -> baselined at 1, so V1 is marked done and V2+ run
# V1 is written with IF NOT EXISTS throughout, so it is harmless either way.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Admin login ---
# ADMIN_PASSWORD_HASH is a BCrypt hash, not a password. Generate one with:
#   mvn -q exec:java -Dexec.mainClass=com.sarkariportal.backend.tool.HashPassword -Dexec.args="yourpassword"
# or any BCrypt tool. The plaintext must never appear in this file.
admin.username=${ADMIN_USERNAME:admin}
admin.password-hash=${ADMIN_PASSWORD_HASH}

# --- JWT ---
# Generate with: openssl rand -base64 48
# Must be at least 32 characters. The application validates this at startup and
# refuses to boot on a short or known-placeholder value.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=rojgarhub

# --- CORS ---
# Comma-separated list of exact origins allowed to call this API. Must include
# the real frontend domain in production; localhost alone will block the
# deployed site. Wildcards, missing schemes and trailing slashes are all
# rejected at startup rather than failing later as a confusing browser error.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Rate limiting (requests per window, per client IP) ---
ratelimit.login.max-attempts=${RATELIMIT_LOGIN_MAX:5}
ratelimit.login.window-seconds=${RATELIMIT_LOGIN_WINDOW:900}
ratelimit.subscribe.max-attempts=${RATELIMIT_SUBSCRIBE_MAX:3}
ratelimit.subscribe.window-seconds=${RATELIMIT_SUBSCRIBE_WINDOW:3600}
# How long the same IP is ignored when re-viewing the same job.
viewcount.dedup-seconds=${VIEWCOUNT_DEDUP_SECONDS:21600}

# --- Logging ---
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
# Never log SQL parameters; they can contain subscriber email addresses.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
