name: Collect official job notices

on:
  schedule:
    # 06:00 IST (UTC+05:30). GitHub cron only supports whole minutes in UTC.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-notice-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Node 24-compatible action runtimes. The v4 actions are being forced
      # onto Node 24 by GitHub-hosted runners and will eventually be removed.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Restore document cache
        uses: actions/cache@v5
        with:
          path: pipeline/cache
          key: official-notice-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            official-notice-cache-${{ runner.os }}-
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Collect candidates
        id: collect
        working-directory: pipeline
        # run.js exits 1 when the sources were too unhealthy to trust the day's
        # output -- most of them failing, or only the aggregator answering. That
        # verdict must not throw away the CSV and report, which are still worth
        # reading and are how you find out what happened. So the step is allowed
        # to fail here, the files are uploaded and committed either way, and the
        # last step in the job turns the failure back into a red run.
        continue-on-error: true
        env:
          # Set this repository secret to the public backend API base, e.g.
          # https://your-api.example/api. If absent the run remains safe but
          # cannot remove jobs already published on the site.
          SARKARI_API_URL: ${{ secrets.SARKARI_API_URL }}
        run: node run.js
      - name: Upload review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-review-${{ github.run_id }}
          path: |
            pipeline/out/*.csv
            pipeline/out/*.report.md
          if-no-files-found: warn
          retention-days: 30
      - name: Commit state and review files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/state/seen.json pipeline/out
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: collect job review queue"
          git pull --rebase origin main
          git push origin HEAD:main
      # Deliberately last, so everything above has already run. Without this the
      # `continue-on-error` above would make an unhealthy run look green.
      - name: Fail the run if the sources were unhealthy
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection ran but its sources were unhealthy. The CSV and report were still committed — read the report's source-health table before importing anything."
          exit 1
